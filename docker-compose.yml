version: '3.9'

services:

  postgres-db:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: Testing
    ports:
      - "5432:5432"

    volumes: 
      - postgres-data:/var/lib/postgresql/data
  
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 5s 
      timeout: 5s 
      retries: 10

  seq:
    image: datalust/seq
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5342:80"
  
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  employee-api:
    build:
     context: .
     dockerfile: EmployeeApi.Api/Dockerfile
    container_name: employee-api
    ports:
    - "5000:8080"
    depends_on:
     - postgres-db
     - seq
     - redis

    environment:
     ConnectionStrings__DefaultConnection: Host=3.110.55.230;Port=5432;Database=Testing;Username=postgres;Password=root
     Jwt__Key: ThisIsMyVeryLongSecretKeyForJwtAuthentication12345
     Jwt__Issuer: EmployeeApi
     Jwt__Audience: EmployeeApiUsers
     Redis__ConnectionString: redis:6379
  
volumes:
  postgres-data:   
